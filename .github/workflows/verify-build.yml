name: Verify build
on:
  pull_request:
    types: [opened, reopened]
    branches-ignore:
      - 'dependabot-updates'
  push:
    branches-ignore:
      - 'main'
      - 'dependabot/**'

permissions:
  contents: read

jobs:
  Verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setting up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check formatting
        run: pnpm format:check

      # lint + typecheck + test + build the committed dist/ bundle.
      - name: Lint, typecheck, test and build
        run: pnpm dist

      # Fail if the committed dist/ is missing, untracked, or out of sync with src/.
      # `git status --porcelain` (unlike `git diff`) also catches untracked/absent files.
      - name: Compare the expected and actual dist/ directories
        id: diff
        run: |
          if [ -n "$(git status --porcelain dist/)" ]; then
            echo "dist/ is out of sync or not committed. Run 'pnpm build' and commit dist/. Status:"
            git status --porcelain dist/
            git diff --ignore-space-at-eol dist/
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        with:
          name: dist
          path: dist/
